name: Publish Memora Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 1.0.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_USERNAME: liushen-fork

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Validate version and collect commits
        id: release
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi

          previous_tag=$(git tag -l 'v*' --sort=-version:refname | sed -n '1p')
          if [[ -n "$previous_tag" ]]; then
            git log "${previous_tag}..HEAD" --pretty=format:"- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" > release-notes.md
          else
            git log --pretty=format:"- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" > release-notes.md
          fi
          if [[ ! -s release-notes.md ]]; then
            echo '- Maintenance release' > release-notes.md
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$VERSION" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo 'docker_tags<<EOF'
            echo "ghcr.io/liushen-fork/memora:${VERSION}"
            echo 'ghcr.io/liushen-fork/memora:nightly'
            if [[ "$VERSION" != *-* ]]; then
              echo 'ghcr.io/liushen-fork/memora:latest'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Build release binaries
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            'linux amd64' \
            'linux arm64' \
            'windows amd64' \
            'darwin amd64' \
            'darwin arm64'; do
            read -r goos goarch <<< "$target"
            archive="memora-${VERSION}-${goos}-${goarch}"
            binary='memora'
            [[ "$goos" == 'windows' ]] && binary='memora.exe'
            mkdir -p "build/${archive}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
            go build -trimpath -ldflags='-s -w' -o "build/${archive}/${binary}" ./cmd/memora
            tar -C "build/${archive}" -czf "dist/${archive}.tar.gz" .
            rm -rf "build/${archive}"
          done
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            MEMORA_VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.release.outputs.docker_tags }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Memora v${VERSION}" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"
